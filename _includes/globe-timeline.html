<!--
  =====================================================================
  可交互地球时间线组件（浅色线框风格）
  =====================================================================
  用法（academicpages / Jekyll）：
  1. 把这个文件整体存为 _includes/globe-timeline.html
  2. 在 _pages/cv.md（或任意页面）的正文里加一行：
        {% include globe-timeline.html %}
  3. 修改下面 "EXPERIENCES" 数组里的经历数据即可。

  依赖：D3.js v7（CDN 引入，无需本地安装任何东西）
  =====================================================================
-->

<div id="globe-timeline-root" style="max-width:1100px;margin:0 auto;">
  <div style="display:flex;gap:32px;align-items:stretch;flex-wrap:wrap;">

    <!-- 左侧：时间线列表 -->
    <div id="gt-timeline" style="flex:1 1 380px;min-width:300px;">
      <!-- 由 JS 动态生成 -->
    </div>

    <!-- 右侧：地球 -->
    <div style="flex:1 1 380px;min-width:320px;display:flex;align-items:center;justify-content:center;">
      <svg id="gt-globe" viewBox="0 0 500 500" style="width:100%;max-width:460px;"></svg>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-geo-projection/4.0.0/d3-geo-projection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
  #globe-timeline-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .gt-item {
    display: grid;
    grid-template-columns: 110px 1px 1fr;
    gap: 18px;
    padding: 18px 0;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .gt-item:hover, .gt-item.active {
    background: #fafafa;
  }
  .gt-date {
    font-size: 13px;
    color: #999;
    line-height: 1.5;
    text-align: right;
  }
  .gt-item.active .gt-date { color: #c0392b; }
  .gt-divider { background: #eee; }
  .gt-body .gt-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 4px 0;
  }
  .gt-body .gt-org {
    font-size: 14px;
    color: #333;
    margin: 0 0 2px 0;
  }
  .gt-body .gt-loc {
    font-size: 13px;
    color: #999;
    margin: 0 0 2px 0;
  }
  .gt-body .gt-note {
    font-size: 13px;
    color: #999;
    font-style: italic;
    margin: 4px 0 0 0;
  }

  /* 地球样式 */
  .gt-sphere { fill: #ffffff; stroke: #d8dde3; stroke-width: 1; }
  .gt-graticule { fill: none; stroke: #eef1f4; stroke-width: 0.6; }
  .gt-land { fill: #eef2f6; stroke: #d4dbe2; stroke-width: 0.6; }
  .gt-point {
    fill: #c0392b;
    stroke: #fff;
    stroke-width: 1.5;
    transition: r 0.25s ease;
  }
  .gt-point.active { fill: #e74c3c; }
  .gt-arc {
    fill: none;
    stroke: #e0a0a0;
    stroke-width: 1.3;
    stroke-dasharray: 4 3;
    opacity: 0.85;
  }
  .gt-label {
    font-size: 10px;
    fill: #c0392b;
    font-weight: 600;
    pointer-events: none;
  }
</style>

<script>
(function () {
  // ==================== 1. 在这里配置你的经历数据 ====================
  const EXPERIENCES = [
    {
      date: "09/2026 -",
      title: "Ph.D. Researcher",
      org: "University of Vienna",
      loc: "Vienna, Austria",
      note: "Working with Prof. Torsten Möller",
      coords: [16.3738, 48.2082] // [经度, 纬度]
    },
    {
      date: "01/2026 - 09/2026",
      title: "Postdoctoral Fellow",
      org: "Dept. of Geography, National University of Singapore",
      loc: "Singapore",
      note: "Supervised by Prof. Wei Luo",
      coords: [103.8198, 1.3521]
    },
    {
      date: "01/2024 - 09/2024",
      title: "Visiting Student",
      org: "Inria, Université Paris-Saclay",
      loc: "Paris, France",
      note: "Supervised by Jean-Daniel Fekete",
      coords: [2.3522, 48.8566]
    },
    {
      date: "07/2022 - 06/2023",
      title: "Research Intern",
      org: "Microsoft Research Asia",
      loc: "Beijing, China",
      note: "",
      coords: [116.4074, 39.9042]
    }
  ];
  // ====================================================================

  const state = { active: 0 };

  const svg = d3.select("#gt-globe");
  const width = 500, height = 500;
  svg.attr("viewBox", `0 0 ${width} ${height}`);

  const projection = d3.geoOrthographic()
    .scale(220)
    .translate([width / 2, height / 2])
    .clipAngle(90)
    .rotate([-16, -25, 0]); // 初始朝向欧洲附近

  const path = d3.geoPath(projection);
  const graticule = d3.geoGraticule();

  svg.append("circle")
    .attr("class", "gt-sphere")
    .attr("cx", width / 2)
    .attr("cy", height / 2)
    .attr("r", projection.scale());

  svg.append("path")
    .datum(graticule())
    .attr("class", "gt-graticule")
    .attr("d", path);

  const landGroup = svg.append("g");
  const pointsGroup = svg.append("g");
  const labelGroup = svg.append("g");

  // 世界陆地轮廓（简化版 world-atlas，CDN 加载）
  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json").then(function (world) {
    const land = topojson.feature(world, world.objects.land);
    landGroup.selectAll("path")
      .data([land])
      .join("path")
      .attr("class", "gt-land")
      .attr("d", path);
    render();
  }).catch(function () {
    // 若 CDN 加载失败，仍渲染纯经纬网 + 点
    render();
  });

  function render() {
    landGroup.selectAll("path").attr("d", path);

    pointsGroup.selectAll("circle")
      .data(EXPERIENCES)
      .join("circle")
      .attr("class", (d, i) => "gt-point" + (i === state.active ? " active" : ""))
      .attr("r", (d, i) => (i === state.active ? 5 : 3))
      .attr("transform", d => {
        const p = projection(d.coords);
        return p ? `translate(${p[0]},${p[1]})` : "translate(-100,-100)";
      })
      .style("display", d => {
        const visible = isVisible(d.coords);
        return visible ? "block" : "none";
      });

    labelGroup.selectAll("text")
      .data([EXPERIENCES[state.active]])
      .join("text")
      .attr("class", "gt-label")
      .attr("transform", d => {
        const p = projection(d.coords);
        return p ? `translate(${p[0] + 8},${p[1] - 8})` : "translate(-100,-100)";
      })
      .text(d => d.loc.split(",")[0])
      .style("display", d => isVisible(d.coords) ? "block" : "none");
  }

  function isVisible(coords) {
    const rotate = projection.rotate();
    const center = [-rotate[0], -rotate[1]];
    const dist = d3.geoDistance(coords, center);
    return dist < Math.PI / 2;
  }

  function rotateTo(coords, done) {
    const targetRotate = [-coords[0], -coords[1], 0];
    const currentRotate = projection.rotate();

    d3.transition()
      .duration(900)
      .ease(d3.easeCubicInOut)
      .tween("rotate", function () {
        const r = d3.interpolate(currentRotate, targetRotate);
        return function (t) {
          projection.rotate(r(t));
          render();
        };
      })
      .on("end", function () {
        if (done) done();
      });
  }

  // ==================== 渲染左侧时间线 ====================
  const timelineDiv = d3.select("#gt-timeline");
  const items = timelineDiv.selectAll(".gt-item")
    .data(EXPERIENCES)
    .join("div")
    .attr("class", (d, i) => "gt-item" + (i === state.active ? " active" : ""))
    .on("mouseenter", function (event, d) {
      const i = EXPERIENCES.indexOf(d);
      state.active = i;
      items.attr("class", (dd, ii) => "gt-item" + (ii === i ? " active" : ""));
      rotateTo(d.coords);
    });

  items.append("div").attr("class", "gt-date").text(d => d.date);
  items.append("div").attr("class", "gt-divider");
  const body = items.append("div").attr("class", "gt-body");
  body.append("p").attr("class", "gt-title").text(d => d.title);
  body.append("p").attr("class", "gt-org").text(d => d.org);
  body.append("p").attr("class", "gt-loc").text(d => "📍 " + d.loc);
  body.filter(d => d.note).append("p").attr("class", "gt-note").text(d => d.note);

})();
</script>
