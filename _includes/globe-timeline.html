<div id="globe-timeline-root" style="max-width:1100px;margin:0 auto;position:relative;">
  <div style="display:flex;gap:32px;align-items:stretch;flex-wrap:wrap;position:relative;">

    <div id="gt-timeline" style="flex:1 1 380px;min-width:300px;position:relative;">
    </div>

    <div id="gt-globe-wrap" style="flex:1 1 380px;min-width:320px;display:flex;align-items:center;justify-content:center;">
      <svg id="gt-globe" viewBox="0 0 500 500" style="width:100%;max-width:460px;"></svg>
    </div>

    <svg id="gt-connector"
      style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;">
    </svg>

  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-geo-projection/4.0.0/d3-geo-projection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
